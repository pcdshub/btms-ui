[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=45", "setuptools_scm[toml]>=6.2",]

[project]
classifiers = [ "Programming Language :: Python :: 3",]
description = "Beam Transport Motion System GUI and python code"
dynamic = [ "version", "readme", "dependencies", "optional-dependencies",]
keywords = []
name = "btms_ui"
requires-python = ">=3.9"

[options]
zip_safe = false
include_package_data = true

[[project.authors]]
name = "SLAC National Accelerator Laboratory"

[project.license]
file = "LICENSE.md"

[project.scripts]
btms = "btms_ui.main:main"
btps = "btms_ui.launch_btps:main"

[tool.setuptools_scm]
write_to = "btms_ui/_version.py"

[tool.setuptools.dynamic.readme]
file = "README.rst"

[tool.setuptools.dynamic.dependencies]
file = [ "requirements.txt",]

[tool.setuptools.dynamic.optional-dependencies.test]
file = "dev-requirements.txt"

[tool.setuptools.dynamic.optional-dependencies.doc]
file = "docs-requirements.txt"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]
preview = ["pixi-build"]

[tool.pixi.pypi-dependencies]
btms_ui = { path = ".", editable = true }
nf-ff-alignment = { git = "ssh://git@github.com/pcdshub/nf_ff_alignment.git", tag = "v1.0.0" }

[tool.pixi.tasks]

[tool.pixi.dependencies]
pcdswidgets = ">=2.3.0,<3"
pyqt = "==5.15.11,<6"
pcdsdevices = ">=10.5.0,<11"
typhos = ">=4.3.0,<5"

[tool.pixi.system-requirements]
linux = "3.10"
libc = "2.17"
